<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Server</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
        <a href="/guestbook">Guestbook</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/space">Space</a>
    </nav>
    <h1>Express Server</h1>
    <p>Welcome to the Express Server!</p>
    <div id="login-section">
        <h2>Login</h2>
        <form id="login-form" action="/login" method="post">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
            <label><input type="checkbox" name="rememberMe" /> Remember me</label>
            <button type="submit">Log in</button>
        </form>
        <p id="login-message" role="status"></p>
        <p id="status"></p>


    </div>
    <button id="logout-button" type="submit">Log out</button>

    <script>
        const loginForm = document.querySelector('#login-form');
        const loginMessage = document.querySelector('#login-message');

        const status = document.querySelector('#status');
        const loginSection = document.querySelector('#login-section');
        const logoutButton = document.querySelector('#logout-button');

        async function checkAuthState() {
            try {
                const response = await fetch('/api/whoami');
                const data = await response.json();

                if (data.loggedIn) {
                    status.innerHTML = '<h1>Welcome back!</h1><a href="/dashboard">Dashboard</a>';
                    loginSection.hidden = true;
                    logoutButton.hidden = false;
                } else {
                    status.innerHTML = '<h1>Welcome!</h1>';
                    loginSection.hidden = false;
                    logoutButton.hidden = true;
                }
            } catch (error) {
                status.innerHTML = '<h1>Welcome!</h1>';
                loginSection.hidden = false;
                logoutButton.hidden = true;
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.querySelector('#password').value;
            const rememberMe = event.target.rememberMe.checked;

            const response = await fetch(loginForm.action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, rememberMe })
            });

            const data = await response.json().catch(() => ({ success: false }));

            if (data.success) {
                loginMessage.textContent = 'Login successful!';
                loginForm.reset();
                await checkAuthState();
                window.location.href = data.redirect || '/';
            } else {
                loginMessage.textContent = data.error || 'Login failed. Please check your password.';
            }
        });

        logoutButton.addEventListener('click', async () => {
            const response = await fetch('/logout', {
                method: 'POST'
            });

            const data = await response.json().catch(() => ({ success: false }));
            if (data.success) {
                window.location.href = '/';
            }
        });
        checkAuthState();
    </script>
</body>

</html>
