<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
        <a href="/guestbook">Guestbook</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/space">Space</a>
    </nav>
    <button id="logout-button" type="submit">Log out</button>
    <h1>Guestbook</h1>
    <p id="list-error" role="alert"></p>
    <ul id="guestbook-list" class="guestbook-list"></ul>
    <form id="guestbook-form">
        <label for="name">Name</label>
        <input id="name" type="text" name="name" maxlength="40" required />

        <label for="msg">Message</label>
        <textarea id="msg" name="msg" maxlength="280" required></textarea>

        <button type="submit">Post</button>
    </form>
    <p id="form-error" role="alert"></p>


    <script src="/js/logout.js"></script>
    <script src="/js/guestbook.js"></script>
</body>

</html>
